{% extends 'garage/base.html' %}
{% block title %}{{ title }} — MSLog{% endblock %}
{% block content %}
<div class="page-header">
  <h1 class="page-title"><i class="bi bi-car-front text-primary me-2"></i>{{ title }}</h1>
</div>
<div class="row justify-content-center">
  <div class="col-md-7">
    <div class="card p-4">
      <form method="post">
        {% csrf_token %}
        {% for field in form %}
        <div class="mb-3">
          <label class="form-label fw-semibold">{{ field.label }}</label>
          {{ field }}
          {% if field.errors %}
            <div class="text-danger small mt-1">{{ field.errors|join:", " }}</div>
          {% endif %}
        </div>
        {% endfor %}
        <div class="d-flex gap-2 mt-2">
          <button type="submit" class="btn btn-primary">
            <i class="bi bi-check-lg me-1"></i>Save
          </button>
          <a href="{% url 'vehicle_list' %}" class="btn btn-outline-secondary">Cancel</a>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
